<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="A house with solar panels under a bright sun. Power flows from the roof to a locked hold, then to a released payment.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7dcff"/>
      <stop offset=".62" stop-color="#eaf2ff"/>
      <stop offset="1" stop-color="#fff4dc"/>
    </linearGradient>
    <radialGradient id="sun" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#fff6b3"/>
      <stop offset=".55" stop-color="#ffcf33"/>
      <stop offset="1" stop-color="#ff9f1a"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd84d" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd84d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5bea"/>
      <stop offset="1" stop-color="#1b2f8f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd39a"/>
      <stop offset="1" stop-color="#22a46b"/>
    </linearGradient>
    <linearGradient id="hold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb648"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="paid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <clipPath id="frame"><rect width="560" height="360" rx="24"/></clipPath>
    <clipPath id="roof-panels"><path d="M200.8 118 H291.2 L308.4 142 H183.6 Z M180.7 146 H311.3 L325.7 166 H166.3 Z"/></clipPath>
  </defs>
  <style>
    .rays { transform-origin: 448px 78px; animation: spin 40s linear infinite; }
    .glow { transform-origin: 448px 78px; animation: breathe 4s ease-in-out infinite; }
    .cloud-a { animation: drift 26s linear infinite; }
    .cloud-b { animation: drift 38s linear infinite; animation-delay: -14s; }
    .shine { animation: sweep 3.6s ease-in-out infinite; }
    .flow { stroke-dasharray: 2 14; animation: flow 1.1s linear infinite; }
    .flow-2 { stroke-dasharray: 2 14; animation: flow 1.1s linear infinite; animation-delay: -.55s; }
    .pulse { transform-origin: 400px 248px; animation: pulse 2.4s ease-in-out infinite; }
    .pop { transform-origin: 490px 248px; animation: pop 4.8s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 50% { transform: scale(1.12); opacity: .75; } }
    @keyframes drift { from { transform: translateX(-180px); } to { transform: translateX(640px); } }
    @keyframes sweep { 0% { transform: translateX(-140px); } 60%, 100% { transform: translateX(220px); } }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @keyframes pulse { 50% { transform: scale(1.08); } }
    @keyframes pop { 0%, 55% { transform: scale(.82); opacity: .35; } 65% { transform: scale(1.06); opacity: 1; } 75%, 100% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pop { opacity: 1; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="560" height="360" fill="url(#sky)"/>
    <circle class="glow" cx="448" cy="78" r="92" fill="url(#glow)"/>
    <g class="rays" stroke="#ffb020" stroke-width="5" stroke-linecap="round">
      <path d="M448 18v14M448 124v14M388 78h14M494 78h14M405.6 35.6l9.9 9.9M480.5 110.5l9.9 9.9M405.6 120.4l9.9-9.9M480.5 45.5l9.9-9.9"/>
    </g>
    <circle cx="448" cy="78" r="34" fill="url(#sun)"/>
    <g class="cloud-a" fill="#fff" opacity=".9">
      <path d="M40 70a18 18 0 0 1 34-8 14 14 0 0 1 22 12 12 12 0 0 1-2 24H46a16 16 0 0 1-6-28z"/>
    </g>
    <g class="cloud-b" fill="#fff" opacity=".75">
      <path d="M220 40a14 14 0 0 1 26-6 11 11 0 0 1 17 9 9 9 0 0 1-1 18h-38a12 12 0 0 1-4-21z"/>
    </g>
    <path d="M0 292 C120 250 250 262 360 280 C450 294 510 282 560 268 V360 H0 Z" fill="url(#hill)"/>
    <path d="M0 318 C140 296 300 304 420 318 C480 325 530 320 560 314 V360 H0 Z" fill="#1f9a63" opacity=".55"/>

    <!-- House -->
    <rect x="166" y="168" width="160" height="104" rx="6" fill="#fff8ec"/>
    <rect x="166" y="168" width="160" height="10" fill="#f1e2c8"/>
    <rect x="232" y="214" width="34" height="58" rx="4" fill="#ff8a3d"/>
    <circle cx="259" cy="244" r="2.5" fill="#fff3e0"/>
    <rect x="184" y="196" width="34" height="30" rx="4" fill="#8cc4ff"/>
    <rect x="278" y="196" width="34" height="30" rx="4" fill="#8cc4ff"/>
    <path d="M201 196v30M184 211h34M295 196v30M278 211h34" stroke="#fff8ec" stroke-width="3"/>
    <path d="M150 172 L196 108 H296 L342 172 Z" fill="#f2694f"/>
    <path d="M142 174 H350" stroke="#e2523a" stroke-width="8" stroke-linecap="round"/>

    <!-- Panels, two rows on the roof slope -->
    <g stroke="#e6eeff" stroke-width="2.5" stroke-linejoin="round">
      <path d="M200.8 118 H291.2 L308.4 142 H183.6 Z" fill="url(#panel)"/>
      <path d="M180.7 146 H311.3 L325.7 166 H166.3 Z" fill="url(#panel)"/>
    </g>
    <path d="M223.4 118 L214.8 142 M246 118 V142 M268.6 118 L277.2 142 M213.4 146 L206.2 166 M246 146 V166 M278.6 146 L285.8 166 M192.2 130 H299.8 M173.5 156 H318.5" stroke="#8fb0ff" stroke-width="1.4" opacity=".75"/>
    <g clip-path="url(#roof-panels)">
      <rect class="shine" x="150" y="100" width="56" height="72" fill="url(#shine)"/>
    </g>

    <!-- Power flowing out of the roof, through the hold, to the release -->
    <path d="M326 236 C350 236 360 248 376 248" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".85"/>
    <path class="flow" d="M326 236 C350 236 360 248 376 248" fill="none" stroke="#ff9f1a" stroke-width="5" stroke-linecap="round"/>
    <path d="M424 248 H466" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".85"/>
    <path class="flow-2" d="M424 248 H466" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>

    <g class="pulse">
      <circle cx="400" cy="248" r="24" fill="url(#hold)"/>
      <circle cx="400" cy="248" r="24" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/>
      <path d="M393 245v-5a7 7 0 0 1 14 0v5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <rect x="390" y="245" width="20" height="14" rx="3" fill="#fff"/>
      <circle cx="400" cy="252" r="2" fill="#ff7a1a"/>
    </g>
    <g class="pop">
      <circle cx="490" cy="248" r="24" fill="url(#paid)"/>
      <circle cx="490" cy="248" r="24" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/>
      <path d="M480 248.5l7 7 13-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
